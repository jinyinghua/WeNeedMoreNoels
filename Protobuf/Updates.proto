syntax = "proto3";

option csharp_namespace = "WeNeedMoreNoels.DataStruct";

message UpdateNoelInfo {
	float position_x = 1;
	float position_y = 2;
	bool is_crouch = 3;
	string pose = 4;
	int32 aim = 5;
	int32 hp = 6;
	int32 mp = 7;
}

message UpdateNoelState {
	int32 state = 1;
}

message UpdateNoelDamage {
	int32 hp = 1;
	int32 mp = 2;
}