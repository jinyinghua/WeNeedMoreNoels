name: Build macOS BepInEx Mod

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Required for creating a GitHub Release when a v* tag is pushed.
permissions:
  contents: write

env:
  MOD_NAME: WeNeedMoreNoels
  PLUGIN_FOLDER: WNMN
  DEPENDENCY_TAG: Dependencies
  DEPENDENCY_ASSET: Dependencies.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download and validate game assemblies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # gh uses the GitHub API and avoids fragile redirect/signed-URL handling.
          gh release download "$DEPENDENCY_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$DEPENDENCY_ASSET" \
            --output "$DEPENDENCY_ASSET" \
            --clobber

          mkdir -p lib
          # The archive may contain a parent directory. -j deliberately flattens it.
          unzip -j -q "$DEPENDENCY_ASSET" '*.dll' -d lib
          rm "$DEPENDENCY_ASSET"

          required=(Assembly-CSharp.dll pixelliner.dll unsafeAssem.dll better.dll)
          for file in "${required[@]}"; do
            test -s "lib/$file" || { echo "Missing required compilation assembly: $file"; exit 1; }
          done
          echo 'Compilation assemblies:'
          ls -lh lib

      - name: Restore
        run: dotnet restore WeNeedMoreNoels.csproj

      - name: Build
        run: dotnet build WeNeedMoreNoels.csproj --configuration Release --no-restore --output "$PWD/build_output" -p:GameAssembliesPath="$PWD/lib"

      - name: Create installable package
        shell: bash
        run: |
          set -euo pipefail
          install_dir="package/BepInEx/plugins/$PLUGIN_FOLDER"
          mkdir -p "$install_dir"
          cp -a build_output/. "$install_dir/"

          # Game DLLs are supplied by the player's own installed game, not by this mod.
          rm -f "$install_dir"/{Assembly-CSharp,pixelliner,unsafeAssem,better}.dll

          # Do not claim Thunderstore compatibility unless its required manifest/icon exist.
          test -f README.md && cp README.md package/
          (cd package && zip -r "../${MOD_NAME}-macOS.zip" .)
          unzip -l "${MOD_NAME}-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}-macOS
          path: ${{ env.MOD_NAME }}-macOS.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}-macOS
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MOD_NAME }}-macOS.zip
          generate_release_notes: true
